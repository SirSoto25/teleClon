# CI de Parlo: compila, prueba y pasa clippy en Linux, Windows y macOS (ADR-0006, docs/packaging.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Misma versión que se usa en local (Cargo.toml: rust-version = "1.99").
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: build + test + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain de Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Salida de audio (cpal → ALSA) en Linux; Windows y macOS no necesitan nada (ADR-0007).
      # Stickers TGS animados (rlottie, solo Linux, ADR-0008): rlottie-sys clona rlottie con git (red en
      # el build), lo compila con cmake + g++ y genera enlaces con bindgen (libclang).
      - name: Dependencias de audio y de rlottie (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake g++ git libclang-dev

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

