# Workspace de Parlo (los crates y el repo conservan el prefijo interno tc-/teleClon; ADR-0005).
# Arquitectura: docs/architecture.md · Decisiones: docs/adr/0001-stack.md, docs/adr/0003-arquitectura.md
# Versiones verificadas con `cargo search` / `cargo info` el 2026-11-06 (Rust 1.99.1).

[workspace]
resolver = "3"
members = [
    "crates/tc-core",
    "crates/tc-mock",
    "crates/tc-store",
    "crates/tc-theme",
    "crates/tc-secret",
    "crates/tc-stickers",
    "crates/tc-ui",
    "crates/tc-app",
    "crates/tc-telegram",
    "crates/tc-audio",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Crates internos
tc-core = { path = "crates/tc-core" }
tc-mock = { path = "crates/tc-mock" }
tc-store = { path = "crates/tc-store" }
tc-theme = { path = "crates/tc-theme" }
tc-secret = { path = "crates/tc-secret" }
tc-stickers = { path = "crates/tc-stickers" }
tc-ui = { path = "crates/tc-ui" }
tc-telegram = { path = "crates/tc-telegram" }
tc-audio = { path = "crates/tc-audio" }

# Async y utilidades
tokio = { version = "1.54.1", default-features = false }
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"
jiff = "0.2.39"

# UI: iced 0.14 (wgpu + respaldo software tiny-skia, Wayland y X11 por defecto)
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "lazy", "advanced", "qr_code"] }

# Persistencia: SQLite empaquetado (sin dependencia del sqlite del sistema).
# rusqlite_migration 2.6 exige rusqlite ^0.40, por eso las migraciones se hacen a mano con PRAGMA user_version.
rusqlite = { version = "0.41.1", features = ["bundled"] }
keyring = "4.2.0"

# Criptografía de chats secretos (RustCrypto, mismas series que usa grammers-crypto 0.11)
aes = "0.9.4"
ige = { version = "0.2.1", default-features = false, features = ["zeroize"] }
aes-gcm = "0.11.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
num-bigint = "0.5.1"
getrandom = "0.4.3"
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"

# Stickers
# jpeg: fotos de perfil y de mensajes de la red (decodificador zune-jpeg, Rust puro).
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }
flate2 = "1.1.11"
rlottie = "0.5.4"

# Red de Telegram (crate tc-telegram, hito M2.1). grammers-crypto se usa directamente para el SRP de 2FA
# (misma versión que arrastra grammers-client). serde/serde_json: sesión serializada.
grammers-client = "0.11.0"
grammers-crypto = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
grammers-session = { version = "0.11.0", default-features = false, features = ["serde"] }
grammers-tl-types = "0.11.0"

# Audio (crate tc-audio, ADR-0007): Rust puro salvo la salida de cpal (ALSA en Linux, WASAPI en
# Windows, CoreAudio en macOS). rodio solo para la salida (sin sus decodificadores); symphonia 0.5
# (la misma serie que usa rodio) para MP3/AAC-M4A/FLAC/WAV/Vorbis y opus-decoder para las notas de voz.
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis"] }
opus-decoder = "0.1.1"

[profile.dev.package."*"]
# Dependencias optimizadas en debug: el render de iced y la cripto son lentos sin optimizar.
opt-level = 2

[profile.dev.package.opus-decoder]
# opus-decoder 0.1.1 desplaza un `u8` 8 bits o más en la máscara de anti-colapso de CELT
# (`celt/vq.rs`, `extract_collapse_mask`) y en debug eso es un pánico; en release se envuelve. Se
# compila igual que en release para que debug y pruebas se comporten como la app. Además tc-audio
# atrapa cualquier pánico del decodificador (ADR-0007).
overflow-checks = false
