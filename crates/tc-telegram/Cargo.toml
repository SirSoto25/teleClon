[package]
name = "tc-telegram"
description = "GrammersBackend: ChatBackend sobre la red de Telegram (MTProto vía grammers 0.11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tc-core.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs", "io-util"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
# grammers-session va sin `sqlite-storage` (sin libsql, comprobado con `cargo tree -i libsql`) y con `serde`.
grammers-client.workspace = true
grammers-session.workspace = true
grammers-tl-types.workspace = true
grammers-crypto.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
# El transporte falso de los tests necesita decodificar las peticiones TL.
grammers-tl-types = { workspace = true, features = ["deserializable-functions"] }
