[package]
name = "tc-ui"
description = "Interfaz iced de Parlo: shell, pantallas S01-S37, lista virtual, estilos desde tc-theme."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tc-core.workspace = true
tc-theme.workspace = true
tc-stickers.workspace = true
# Notas de voz y audios: decodificado y reproductor en su propio hilo (ADR-0007).
tc-audio.workspace = true
# GIFs de Telegram (MP4/H.264) a fotogramas, fuera del hilo de la UI (ADR-0010).
tc-video.workspace = true
# Notificaciones de escritorio (fase C2, ADR-0013): reglas, Notifier y eventos de clic.
tc-notify.workspace = true
# `canvas`: fondo de curvas de nivel y celdas de la huella de clave (aditivo sobre las features del workspace).
iced = { workspace = true, features = ["canvas"] }
futures.workspace = true
# Decodificar fotos de perfil y de mensajes (JPEG/PNG/WebP) fuera del hilo de la UI.
# `gif`: animar los GIF reales del panel y de las burbujas (ADR-0010).
image = { workspace = true, features = ["gif"] }
# Catálogo de emojis del panel del compositor (ADR-0009).
emojis.workspace = true
tokio = { workspace = true, features = ["rt"] }
# Envío de archivos (A2): selector nativo y pegar imágenes del portapapeles.
rfd.workspace = true
arboard.workspace = true
# Descargas (A3): carpeta de descargas por defecto.
dirs.workspace = true
jiff.workspace = true
tracing.workspace = true

[dev-dependencies]
tc-mock.workspace = true
# Capturas sin ventana del panel del compositor (`tests_panel_shots.rs`, ignorada por defecto).
iced_test = "0.14.0"
# `test-util`: reloj virtual (`start_paused`) para ver el progreso simulado de las subidas.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

# Stickers TGS animados (rlottie) activados por defecto SOLO en Linux (ADR-0008): rlottie-sys clona
# rlottie con git, lo compila con cmake + C++ y genera los enlaces con bindgen (libclang). En Windows
# `rlottie` 0.5.4 ni compila (usa `std::os::unix`) y en macOS su build.rs enlaza `-lstdc++` fijo.
[target.'cfg(target_os = "linux")'.dependencies]
tc-stickers = { workspace = true, features = ["lottie"] }

[features]
default = []
# TGS con rlottie (pasa a `tc-stickers/lottie`). En Linux ya va siempre (ver arriba); esta feature solo
# sirve para probarlo a mano en otro SO. Sin ella, los TGS se dibujan con su miniatura WebP estática.
lottie = ["tc-stickers/lottie"]
