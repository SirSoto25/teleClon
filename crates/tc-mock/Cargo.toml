[package]
name = "tc-mock"
description = "MockBackend: implementación simulada y determinista de ChatBackend para desarrollar sin red."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tc-core.workspace = true
tc-secret.workspace = true
tc-stickers.workspace = true
# Imágenes sintéticas (PNG en memoria) para las fotos de perfil y de los mensajes.
# `gif`: GIFs animados de muestra para el panel de GIFs (ver `gifs.rs`).
image = { workspace = true, features = ["gif"] }
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
